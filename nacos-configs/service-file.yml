# Keep this file ASCII-only: see shared-common.yml for why.
server:
  port: 9010

spring:
  # Schema predates Flyway: baseline at 0 so Flyway records history without
  # re-creating existing tables. New migrations start at V2.
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/matu_file?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      # host / port / password / timeout are provided by shared-common.yml
      database: 0

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

sa-token:
  token-name: Authorization
  timeout: 2592000
  # Only accept the Authorization header; never a cookie (CSRF / token-leak risk).
  is-read-cookie: false
  is-log: false

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id

app:
  file:
    image-max-size-bytes: 10485760
    file-max-size-bytes: 1073741824
    image-allowed-extensions: jpg,jpeg,png
    file-allowed-extensions: jpg,jpeg,png,pdf,doc,docx,xls,xlsx,zip,rar,txt,mp4,mov,avi,mkv
    signed-url-expire-seconds: 600
    oss:
      endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
      region: ${OSS_REGION:cn-hangzhou}
      bucket-name: ${OSS_BUCKET:your-bucket}
      bucket-domain: ${OSS_BUCKET_DOMAIN:https://your-bucket.oss-cn-hangzhou.aliyuncs.com}
      public-domain: ${OSS_PUBLIC_DOMAIN:https://example.com}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      private-bucket: true
